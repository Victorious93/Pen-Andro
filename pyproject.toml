[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pen-andro"
version = "2.0.0"
description = "Automated Android penetration-testing environment setup (Burp CA cert, Frida, ADB tooling)"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "GPL-3.0-or-later" }
authors = [{ name = "raoshaab" }]
dependencies = [
    "click>=8.1",
    "rich>=13.0",
    "requests>=2.31",
    "PyYAML>=6.0",
]

[project.optional-dependencies]
dev = ["pytest>=7.4", "pytest-cov>=4.1", "ruff>=0.4", "flask>=3.0"]
web = ["flask>=3.0"]
build = ["pyinstaller>=6.0"]

[project.scripts]
pen-andro = "pen_andro.cli:main"
pen-andro-gui = "pen_andro.gui:main"
pen-andro-web = "pen_andro.webapp:main"

[tool.setuptools.packages.find]
include = ["pen_andro*"]

[tool.ruff]
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["device: requires a real, rooted ADB device (opt-in; see tests/conftest.py)"]
# Excludes `device`-marked tests by default; `pytest -m device` overrides
# this (the last -m wins), which is how they're meant to be run.
addopts = "-m 'not device'"
